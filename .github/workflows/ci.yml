name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    lint-and-build:
        # Run CI when:
        # - push: normal commits (not release-please's release commits)
        # - pull_request: normal PRs immediately, release-please PRs only after formatting
        if: >
            (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore(main): release')) ||
            (github.event_name == 'pull_request' && (!startsWith(github.head_ref, 'release-please--') || contains(github.event.head_commit.message, 'chore: sync version and format')))
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run ESLint
              run: npm run lint

            - name: Check Prettier formatting
              run: npm run format:check

            - name: Run tests
              run: npm test

            - name: Build (dev standalone)
              run: npm run build:dev

            - name: Build (production libraries)
              run: npm run build

            - name: Verify bundle sizes
              # The ceiling is a guard against a module being silently duplicated
              # into several bundles, not a hosting limit — Greasyfork accepts
              # library files far larger than this.
              #
              # It was 2 MiB (2097152). The ui bundle passed it, and the first
              # thing checked was duplication: gathering-profit.js and
              # production-profit.js were being copied whole into every bundle
              # that imported them, and are now shared through Toolasha.Market
              # (see marketExternalGlobals in rollup.config.js), taking ~19 KB off
              # both ui and actions. That was the real duplication and it is
              # fixed; the remainder is simply that ui legitimately carries the
              # most feature code of any bundle and has grown past 2 MiB honestly.
              #
              # So the limit moves to 2.5 MiB rather than the check being deleted
              # or ui exempted: ~270 KB of headroom over today's largest bundle is
              # enough that a genuinely new duplicate still trips it, which is the
              # whole point of having the check.
              run: |
                  limit=2621440
                  human="2.5MB"
                  entrypoint_size=$(wc -c < "dist/Toolasha.user.js")
                  if [ "$entrypoint_size" -gt "$limit" ]; then
                    echo "❌ dist/Toolasha.user.js is over the $human limit ($entrypoint_size bytes)"
                    exit 1
                  fi
                  echo "✅ dist/Toolasha.user.js is under $human ($entrypoint_size bytes)"
                  for file in dist/libraries/*.js; do
                    size=$(wc -c < "$file")
                    if [ "$size" -gt "$limit" ]; then
                      echo "❌ $file is over the $human limit ($size bytes)"
                      exit 1
                    fi
                    echo "✅ $file is under $human ($size bytes)"
                  done
