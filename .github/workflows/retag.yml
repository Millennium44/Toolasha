name: Retag
# One-shot maintenance: move every tag to the commit its retag/* marker branch
# names, then remove the marker. Dispatched by hand; removed after use.
on: workflow_dispatch
permissions:
    contents: write
jobs:
    retag:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 1
            - name: Move tags to their markers
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git fetch origin '+refs/heads/retag/*:refs/retag/*' --no-tags
                  for ref in $(git for-each-ref --format='%(refname)' refs/retag/); do
                      tag="${ref#refs/retag/}"
                      sha=$(git rev-parse "$ref")
                      echo "retag $tag -> $sha"
                      git push --force origin "$sha:refs/tags/$tag"
                      git push origin ":refs/heads/retag/$tag"
                  done
            - name: Remove stale work branches
              run: |
                  for b in claude/code-review-improvements-q6i4d5 claude/mcs-ingest claude/new-session-s8abcv \
                           release-please--branches--main--components--Toolasha \
                           release-please--branches--main--components--Toolasha--release-notes; do
                      git push origin ":refs/heads/$b" || true
                  done
