name: Release Please

on:
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            publish_version:
                description: 'Re-publish this version to the releases branch and upload its assets, without cutting a new release. Leave blank for the normal release-please flow.'
                required: false
                default: ''

permissions:
    contents: write
    pull-requests: write

jobs:
    release-please:
        runs-on: ubuntu-latest

        steps:
            - name: Run release-please
              id: release
              uses: googleapis/release-please-action@v4
              with:
                  token: ${{ secrets.PAT }}
                  config-file: .release-please-config.json
                  manifest-file: .release-please-manifest.json
                  skip-github-pull-request: ${{ startsWith(github.event.head_commit.message, 'Merge pull request') && contains(github.event.head_commit.message, 'release-please--') }}

            # Publish either when release-please cut a release, or when a version
            # was passed by hand to re-publish one (e.g. after a transient failure).
            - name: Decide what to publish
              id: gate
              run: |
                  if [ "${{ steps.release.outputs.release_created }}" = "true" ]; then
                      echo "should_publish=true" >> "$GITHUB_OUTPUT"
                      echo "version=${{ steps.release.outputs.version }}" >> "$GITHUB_OUTPUT"
                      echo "tag=${{ steps.release.outputs.tag_name }}" >> "$GITHUB_OUTPUT"
                  elif [ -n "${{ github.event.inputs.publish_version }}" ]; then
                      echo "should_publish=true" >> "$GITHUB_OUTPUT"
                      echo "version=${{ github.event.inputs.publish_version }}" >> "$GITHUB_OUTPUT"
                      echo "tag=v${{ github.event.inputs.publish_version }}" >> "$GITHUB_OUTPUT"
                  else
                      echo "should_publish=false" >> "$GITHUB_OUTPUT"
                  fi

            # Build and upload assets if there is a release to publish
            - name: Checkout code
              if: ${{ steps.gate.outputs.should_publish == 'true' }}
              uses: actions/checkout@v6

            - name: Setup Node.js
              if: ${{ steps.gate.outputs.should_publish == 'true' }}
              uses: actions/setup-node@v6
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              if: ${{ steps.gate.outputs.should_publish == 'true' }}
              run: npm ci

            - name: Build (production bundles)
              if: ${{ steps.gate.outputs.should_publish == 'true' }}
              run: npm run build

            - name: Build (Standalone enhancement library)
              if: ${{ steps.gate.outputs.should_publish == 'true' }}
              run: npm run build:enhancement

            - name: Commit built files to releases branch
              if: ${{ steps.gate.outputs.should_publish == 'true' }}
              run: |
                  # Configure git
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

                  # Pull this version's release notes out of the changelog now,
                  # before the releases checkout swaps the working tree away.
                  # GreasyFork renders the message of the commit that touches the
                  # userscript as the version's public changelog, so it must carry
                  # the actual changes, not a release stamp.
                  #
                  # Grab only release-please's own block for the version: stop at
                  # the next `## ` heading, and at the first `### ` heading that is
                  # not one of release-please's sections — the "Fork Changelog"
                  # lives between the title and the version entries with its own
                  # `## Unreleased` / `### ...` headings, and must not bleed in
                  # (it once swept ~240 KB into the notes and overflowed the arg
                  # list of `git commit -m`).
                  notes=$(awk -v ver="${{ steps.gate.outputs.version }}" '
                      BEGIN { split("Features,Bug Fixes,Performance Improvements,Reverts,Documentation,Styles,Miscellaneous Chores,Code Refactoring,Tests,Build System,Continuous Integration,Dependencies", a, ","); for (i in a) known[a[i]] = 1 }
                      /^## \[/ { grab = index($0, "[" ver "]") > 0; next }
                      grab && /^## / { grab = 0 }
                      grab && /^### / { h = $0; sub(/^### /, "", h); if (!(h in known)) grab = 0 }
                      grab { print }
                  ' CHANGELOG.md)
                  [ -n "$notes" ] || notes="See CHANGELOG.md for details."

                  # Save the built files
                  cp dist/Toolasha.user.js /tmp/Toolasha.user.js
                  cp -R dist/libraries /tmp/libraries

                  # Fetch and checkout releases branch (create if doesn't exist)
                  git fetch origin releases:releases 2>/dev/null || git checkout --orphan releases
                  git checkout releases 2>/dev/null || git checkout --orphan releases

                  # Commit the libraries on their own, leaving the userscript
                  # untouched so this commit stays out of GreasyFork's changelog.
                  git rm -rf -q dist/libraries 2>/dev/null || true
                  mkdir -p dist/libraries
                  cp -R /tmp/libraries/* dist/libraries/
                  git add dist/libraries
                  git commit --allow-empty -m "chore: release libraries ${{ steps.gate.outputs.version }}"

                  # Pin entrypoint @require URLs to the library commit SHA
                  lib_sha=$(git rev-parse HEAD)
                  mkdir -p dist
                  cp /tmp/Toolasha.user.js dist/Toolasha.user.js
                  LIB_SHA="$lib_sha" node -e "const fs=require('fs');const path='dist/Toolasha.user.js';const base='https://cdn.jsdelivr.net/gh/${{ github.repository }}@'+process.env.LIB_SHA+'/dist/libraries/';const content=fs.readFileSync(path,'utf8');const updated=content.split('https://UPDATE-THIS-URL/').join(base);fs.writeFileSync(path,updated);"

                  # The userscript commit — the one GreasyFork reads. Title is the
                  # version, body is the release notes. No attribution trailers:
                  # this message is public-facing release copy. Written to a file
                  # rather than passed with -m, so notes of any size are safe.
                  git add dist/Toolasha.user.js
                  {
                      printf '%s\n\n' "Toolasha ${{ steps.gate.outputs.version }}"
                      printf '%s\n' "$notes"
                  } > /tmp/release-message.txt
                  git commit -F /tmp/release-message.txt

                  # Push releases branch
                  git push origin releases

            - name: Upload userscripts and publish release
              if: ${{ steps.gate.outputs.should_publish == 'true' }}
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.gate.outputs.tag }}
                  files: |
                      dist/Toolasha.user.js
                      dist/libraries/*.js
                  draft: false
              env:
                  GITHUB_TOKEN: ${{ secrets.PAT }}
